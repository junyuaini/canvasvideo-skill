<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 散落圆点装饰 -->
  <g fill="#3B82F6" opacity="0.18">
    <circle cx="160" cy="180" r="40"/>
    <circle cx="1120" cy="200" r="56"/>
    <circle cx="200" cy="540" r="48"/>
    <circle cx="1080" cy="560" r="36"/>
  </g>

  <!-- 中央按钮 + 箭头 -->
  <g transform="translate(640 320)">
    <rect x="-180" y="-50" width="360" height="100" rx="50" fill="url(#btn)" opacity="0.95"/>
    <text x="-30" y="14" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="2">
      立即行动
    </text>
    <!-- 箭头 -->
    <g transform="translate(110 0)" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-12" y1="0" x2="24" y2="0"/>
      <polyline points="8,-12 24,0 8,12"/>
    </g>
  </g>

  <!-- 围绕按钮的光芒 -->
  <g opacity="0.35">
    <line x1="640" y1="380" x2="640" y2="500" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 10"/>
    <line x1="540" y1="320" x2="380" y2="320" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 10"/>
    <line x1="740" y1="320" x2="900" y2="320" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 10"/>
  </g>

  <!-- 中央水印 -->
  <g opacity="0.55">
    <text x="640" y="540" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="44" font-weight="700" fill="#1E3A8A" letter-spacing="2">
      我是占位图 · 赶紧换我
    </text>
  </g>
</svg>