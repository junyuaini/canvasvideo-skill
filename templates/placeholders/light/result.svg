<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 网格底 -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.15">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="380" x2="1280" y2="380"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
  </g>

  <!-- 上升柱状图 -->
  <g>
    <rect x="320" y="380" width="80" height="120" rx="6" fill="#FCD34D" opacity="0.85"/>
    <rect x="430" y="320" width="80" height="180" rx="6" fill="#FBBF24" opacity="0.9"/>
    <rect x="540" y="260" width="80" height="240" rx="6" fill="#F59E0B"/>
    <rect x="650" y="200" width="80" height="300" rx="6" fill="#D97706"/>
    <rect x="760" y="140" width="80" height="360" rx="6" fill="#B45309"/>
  </g>

  <!-- 上升折线 + 箭头 -->
  <polyline points="360,360 470,300 580,240 690,180 800,120" fill="none" stroke="#DC2626" stroke-width="3" opacity="0.6"/>
  <polygon points="800,120 820,100 800,90" fill="#DC2626" opacity="0.6"/>

  <!-- 奖杯/星标 -->
  <g transform="translate(960 220)" fill="#F59E0B" opacity="0.85">
    <polygon points="0,-40 12,-12 42,-12 18,8 28,38 0,20 -28,38 -18,8 -42,-12 -12,-12"/>
  </g>

  <!-- 散落亮点 -->
  <g fill="#FBBF24" opacity="0.7">
    <circle cx="200" cy="200" r="5"/>
    <circle cx="1080" cy="380" r="4"/>
    <circle cx="160" cy="420" r="4"/>
  </g>

  <!-- 中央水印 -->
  <g opacity="0.55">
    <text x="640" y="600" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="44" font-weight="700" fill="#78350F" letter-spacing="2">
      我是占位图 · 赶紧换我
    </text>
  </g>
</svg>