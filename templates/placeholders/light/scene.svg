<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- 远山层叠 -->
  <g opacity="0.55">
    <path d="M 0 460 L 160 360 L 300 420 L 460 320 L 620 400 L 780 340 L 940 410 L 1100 350 L 1280 420 L 1280 720 L 0 720 Z" fill="#93C5FD"/>
    <path d="M 0 520 L 200 440 L 380 500 L 560 420 L 740 480 L 920 430 L 1100 490 L 1280 460 L 1280 720 L 0 720 Z" fill="#60A5FA"/>
  </g>

  <!-- 地平线 -->
  <line x1="0" y1="540" x2="1280" y2="540" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>

  <!-- 太阳 -->
  <circle cx="900" cy="220" r="56" fill="#FBBF24" opacity="0.65"/>
  <circle cx="900" cy="220" r="38" fill="#F59E0B" opacity="0.4"/>

  <!-- 飞鸟剪影 -->
  <g stroke="#1E40AF" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 320 200 q 12 -10 24 0 q 12 -10 24 0"/>
    <path d="M 420 170 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 240 240 q 8 -7 16 0 q 8 -7 16 0"/>
  </g>

  <!-- 中央水印 -->
  <g opacity="0.55">
    <text x="640" y="380" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="44" font-weight="700" fill="#1E3A8A" letter-spacing="2">
      我是占位图 · 赶紧换我
    </text>
  </g>
</svg>