<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 几何装饰：圆 + 方 + 三角 -->
  <g opacity="0.7">
    <circle cx="260" cy="240" r="90" fill="none" stroke="#818CF8" stroke-width="3"/>
    <circle cx="260" cy="240" r="50" fill="#6366F1" opacity="0.5"/>

    <rect x="960" y="170" width="160" height="160" rx="20" fill="none" stroke="#34D399" stroke-width="3"/>
    <rect x="990" y="200" width="100" height="100" rx="12" fill="#10B981" opacity="0.55"/>

    <polygon points="240,520 340,520 290,420" fill="none" stroke="#FBBF24" stroke-width="3"/>
    <polygon points="265,500 315,500 290,455" fill="#F59E0B" opacity="0.55"/>

    <circle cx="1020" cy="500" r="70" fill="none" stroke="#F87171" stroke-width="3"/>
    <circle cx="1020" cy="500" r="40" fill="#EF4444" opacity="0.5"/>
  </g>

  <!-- 中央十字准星 -->
  <g opacity="0.6" stroke="#94A3B8" stroke-width="2" fill="none">
    <line x1="540" y1="320" x2="740" y2="320"/>
    <line x1="640" y1="220" x2="640" y2="420"/>
    <circle cx="640" cy="320" r="80"/>
    <circle cx="640" cy="320" r="40"/>
  </g>

  <!-- 散落小点 -->
  <g fill="#94A3B8" opacity="0.7">
    <circle cx="180" cy="380" r="3"/>
    <circle cx="1100" cy="380" r="3"/>
    <circle cx="180" cy="120" r="3"/>
    <circle cx="1100" cy="120" r="3"/>
  </g>

  <!-- 中央水印 -->
  <g opacity="0.6">
    <text x="640" y="500" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="44" font-weight="700" fill="#E2E8F0" letter-spacing="2">
      我是占位图 · 赶紧换我
    </text>
  </g>
</svg>