<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- 远山层叠（夜） -->
  <g opacity="0.85">
    <path d="M 0 460 L 160 360 L 300 420 L 460 320 L 620 400 L 780 340 L 940 410 L 1100 350 L 1280 420 L 1280 720 L 0 720 Z" fill="#1E40AF"/>
    <path d="M 0 520 L 200 440 L 380 500 L 560 420 L 740 480 L 920 430 L 1100 490 L 1280 460 L 1280 720 L 0 720 Z" fill="#1E3A8A"/>
  </g>

  <!-- 地平线 -->
  <line x1="0" y1="540" x2="1280" y2="540" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>

  <!-- 月亮 -->
  <circle cx="900" cy="220" r="50" fill="#FEF3C7" opacity="0.85"/>
  <circle cx="920" cy="208" r="46" fill="#1E1B4B"/>

  <!-- 星星 -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="180" cy="120" r="2.5"/>
    <circle cx="320" cy="80" r="2"/>
    <circle cx="460" cy="180" r="2.5"/>
    <circle cx="220" cy="260" r="2"/>
    <circle cx="540" cy="100" r="2"/>
    <circle cx="720" cy="160" r="2.5"/>
    <circle cx="1100" cy="120" r="2"/>
    <circle cx="1200" cy="220" r="2.5"/>
    <circle cx="1180" cy="320" r="2"/>
    <circle cx="100" cy="200" r="2"/>
  </g>

  <!-- 中央水印 -->
  <g opacity="0.6">
    <text x="640" y="380" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="44" font-weight="700" fill="#DBEAFE" letter-spacing="2">
      我是占位图 · 赶紧换我
    </text>
  </g>
</svg>