<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1717"/>
      <stop offset="100%" stop-color="#0B0719"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 锯齿裂痕（红色警示） -->
  <g stroke="#DC2626" stroke-width="3" fill="none" opacity="0.7">
    <path d="M 180 200 L 240 220 L 220 280 L 280 300 L 260 360 L 320 380"/>
    <path d="M 1100 200 L 1040 220 L 1060 280 L 1000 300 L 1020 360 L 960 380"/>
    <path d="M 200 560 L 260 540 L 280 580 L 340 560"/>
    <path d="M 1080 560 L 1020 540 L 1000 580 L 940 560"/>
  </g>

  <!-- 中央：破碎圆 + 警示 -->
  <g>
    <path d="M 540 280 A 100 100 0 1 1 540 281" fill="none" stroke="#DC2626" stroke-width="3" opacity="0.6" stroke-dasharray="6 8"/>
    <path d="M 640 220 L 700 280 L 660 320 L 700 380 L 600 360 L 560 320 L 600 280 Z" fill="#EF4444" opacity="0.85"/>
    <text x="640" y="295" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="56" font-weight="900" fill="#FECACA">!</text>
  </g>

  <!-- 警告三角碎片 -->
  <g fill="#F59E0B" opacity="0.75">
    <polygon points="380,140 420,140 400,180"/>
    <polygon points="880,560 920,560 900,600"/>
  </g>

  <!-- 烟雾粒子 -->
  <g fill="#7F1D1D" opacity="0.4">
    <circle cx="240" cy="380" r="20"/>
    <circle cx="1060" cy="380" r="24"/>
    <circle cx="220" cy="180" r="16"/>
    <circle cx="1080" cy="180" r="18"/>
  </g>

  <!-- 中央水印 -->
  <g opacity="0.6">
    <text x="640" y="460" text-anchor="middle"
          font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif"
          font-size="44" font-weight="700" fill="#FCA5A5" letter-spacing="2">
      我是占位图 · 赶紧换我
    </text>
  </g>
</svg>